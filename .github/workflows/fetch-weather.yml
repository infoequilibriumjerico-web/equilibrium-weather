name: Fetch Weather Data

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch and save weather data
        env:
          AWN_API_KEY: ${{ secrets.AWN_API_KEY }}
          AWN_APP_KEY: ${{ secrets.AWN_APP_KEY }}
          AWN_MAC: ${{ secrets.AWN_MAC }}
        run: python3 fetch_weather.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add weather-data.json
          git diff --staged --quiet || git commit -m "weather update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
